name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create, for example v1.0.0"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            goos: linux
            goarch: amd64
            archive: latex-ed_linux_x86_64.tar.gz
          - name: Raspberry Pi arm64
            goos: linux
            goarch: arm64
            archive: latex-ed_linux_arm64.tar.gz
          - name: macOS Intel
            goos: darwin
            goarch: amd64
            archive: latex-ed_macos_x86_64.tar.gz
          - name: macOS Apple Silicon
            goos: darwin
            goarch: arm64
            archive: latex-ed_macos_arm64.tar.gz
          - name: Windows x86_64
            goos: windows
            goarch: amd64
            binary: latex-editor.exe
            archive: latex-ed_windows_x86_64.zip

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
          cache: false

      - name: Test
        run: go test ./...

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: go build -trimpath -ldflags="-s -w" -o dist/${{ matrix.binary || 'latex-editor' }} ./cmd/latex-editor

      - name: Package Unix binary
        if: matrix.goos != 'windows'
        run: tar -C dist -czf dist/${{ matrix.archive }} latex-editor

      - name: Package Windows binary
        if: matrix.goos == 'windows'
        run: zip -j dist/${{ matrix.archive }} dist/${{ matrix.binary }}

      - name: Upload release archive
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: dist/${{ matrix.archive }}
          if-no-files-found: error

  release:
    name: Create GitHub release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download release archives
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists, uploading assets..."
            gh release upload "$TAG" release-artifacts/* --clobber
          else
            echo "Creating release $TAG..."
            gh release create "$TAG" release-artifacts/* \
              --title "$TAG" \
              --generate-notes
          fi
